# Test-resource ceilings. Slow sections exclude their duration from the
# default suite. Torch startup cost is measured separately by conftest.
# Rust golden binaries enforce [cargo]; pytest uses the remaining sections.

[pytest]
suite_seconds = 10
test_seconds = 1.0
peak_rss_mb = 300
torch_mb_unmeasured = 750
slowest = 8

[import]
thin_seconds = 0.05
formats_seconds = 0.3

[cargo]
binary_seconds = 2
peak_rss_mb = 200

[exhaustive]
seconds = 30
peak_rss_mb = 1536

[gfx1201]
seconds = 30
peak_rss_mb = 2048

[gfx1201-plain]
seconds = 60
peak_rss_mb = 2048