# Continuous integration for thin. Every job is plain commands a developer
# can run locally (README.md, "Development").
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # GitHub's runners run the tests about 2x slower than the machine
  # tests/budgets.toml is calibrated on: the time budgets are scaled by
  # that, and every report says so.
  # Memory budgets are not scaled. docs/dev/ci.md has the rule.
  THIN_BUDGET_SCALE: "2"

jobs:
  rust:
    name: cargo fmt, clippy and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain pinned in rust-toolchain.toml, with its components.
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # LLVM 22's llvm-mc, llc and llvm-objcopy: the reference of the
      # encoding and wait-state parity tests, which fail without it.
      - &llvm
        name: install LLVM 22
        run: |
          codename=$(lsb_release -cs)
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/llvm.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/llvm.asc] https://apt.llvm.org/$codename/ llvm-toolchain-$codename-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -q && sudo apt-get install -yq llvm-22
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - run: cargo test --workspace

  msrv:
    name: cargo check on the oldest supported Rust (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --workspace --all-targets --locked

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.6"
      - run: ruff format --check .
      - run: ruff check .

  pip:
    name: pip install and pytest (Python ${{ matrix.python }}, no uv)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - *llvm
      - run: python -m pip install -e '.[dev]' -e python/metron
      - run: python -m pytest

  uv:
    name: uv sync and pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: astral-sh/setup-uv@v10.3.3
      - *llvm
      - run: uv sync
      - run: uv run pytest

  wheel:
    name: one abi3 wheel, tested on the oldest and newest Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.10
            3.13
      - run: python3.13 -m pip install "maturin>=1.7,<2" && maturin build --profile dist --out dist
      - run: |
          for py in python3.10 python3.13; do
            $py -m venv "venv-$py"
            "venv-$py/bin/pip" install dist/*.whl
            "venv-$py/bin/python" -c "import thin._native"
          done
      # The suite against the installed wheel, not the checkout: paths and
      # packaging assumptions show only there (thin under site-packages).
      - *llvm
      - run: |
          venv-python3.13/bin/pip install ./python/metron numpy "pytest>=8" "mpmath>=1.3" "ml_dtypes>=0.5"
          venv-python3.13/bin/python -c "import thin, sys; assert 'site-packages' in thin.__file__, thin.__file__"
          venv-python3.13/bin/python -m pytest

  metron:
    name: metron alone, without thin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install ./python/metron "pytest>=8"
      - run: python -c "import metron, importlib.util; assert importlib.util.find_spec('thin') is None"
      - run: python -m pytest tests/metron/test_independence.py

  golden:
    name: golden data regenerated from code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # metron's and opspec's generators need torch; the CPU build does.
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]' -e python/metron
      # Every fully generated component, whole. codegen and target_text also
      # carry recorded numeric tables, so they are held to their authored
      # files (the recorded tables kept); `all --check` itself still fails
      # on those and on the recorded files without a generator
      # (tools/golden/README.md).
      - run: |
          for c in target formats lib metron dsl runtime opspec ir passes emu_text; do
            python -m tools.golden "$c" --check
          done
      - run: python -m tools.golden all --authored --check
      - run: python -m tools.golden --authored-coverage

  binding:
    name: the binding crate holds no domain logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m tools.check_binding
